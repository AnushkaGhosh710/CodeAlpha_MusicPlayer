<!DOCTYPE html>
<html>
<head>
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">

    <img id="cover" src="cover.png" width="200">

    <h2 id="title">Song Name</h2>

    <audio id="audio"></audio>

    <input
        type="range"
        id="progress"
        value="0">

    <br><br>

    <button onclick="prevSong()">⏮</button>
    <button onclick="playPause()">▶/⏸</button>
    <button onclick="nextSong()">⏭</button>

    <br><br>

    Volume

    <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.1"
        value="1">

</div>

<script src="script.js"></script>
</body>
</html>
